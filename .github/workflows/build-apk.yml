name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' 

      - name: Install Dependencies
        run: npm install

      - name: Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: Inject AdMob App ID
        env:
          PRODUCTION_ADMOB_APP_ID: "ca-app-pub-7429886592096633~7084313869"
        run: |
          node -e "
          const fs = require('fs');
          const path = 'android/app/src/main/AndroidManifest.xml';
          
          let targetAppId = process.env.PRODUCTION_ADMOB_APP_ID;
          if (!targetAppId || targetAppId.includes('XXXXXXXXXX') || targetAppId.trim() === '') {
            targetAppId = 'ca-app-pub-3940256099942544~3347511713';
            console.log('⚠️ Production ID not configured. Using Google AdMob Test App ID.');
          } else {
            console.log('✅ Injecting Production AdMob App ID.');
          }

          if (fs.existsSync(path)) {
            let m = fs.readFileSync(path, 'utf8');
            
            if (!m.includes('com.google.android.gms.ads.APPLICATION_ID')) {
              const metaAdmob = '\n        <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"' + targetAppId + '\"/>';
              m = m.replace('</application>', metaAdmob + '\n    </application>');
              fs.writeFileSync(path, m, 'utf8');
              console.log('🎉 Successfully injected AdMob configurations.');
            } 
            else if (targetAppId !== 'ca-app-pub-3940256099942544~3347511713') {
              const testId = 'ca-app-pub-3940256099942544~3347511713';
              if (m.includes(testId)) {
                m = m.replace(testId, targetAppId);
                fs.writeFileSync(path, m, 'utf8');
                console.log('🔄 Replaced existing Scaffold Test ID with Production App ID.');
              }
            } else {
              console.log('ℹ️ Manifest already contains a valid AdMob App ID setup. Skipping.');
            }
          } else {
            console.error('❌ Error: AndroidManifest.xml path not found.');
            process.exit(1);
          }
          "

      - name: Sync Native Assets
        run: npx cap sync android

      # 📱 FIRST BUILD: Generate keystore if KEYSTORE_BASE64 secret doesn't exist
      - name: Generate Production Keystore File (First Build Only)
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias ${{ secrets.KEY_ALIAS }} \
            -keyalg RSA \
            -keysize 2048 \
            -validity 18250 \
            -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            -dname "CN=NeonReflexClicker, OU=GAMING, O=GASANAA, L=THIRUVANANTHAPURAM, S=KERALA, C=IN"

      # Decode Base64 keystore for subsequent builds
      - name: Decode Keystore from Base64 (Subsequent Builds)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Compile Native Android Release Package Binary
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      # Cryptographically signs the generated APK using the keystore
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 == '' && 'TO_BE_CAPTURED' || secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
          SIGNING_KEY_STORE_PATH: ${{ github.workspace }}/release.keystore

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon-reflex-signed-apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Auto Tag & Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Neon Reflex Signed Build #${{ github.run_number }}"
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}

      # 🔐 CAPTURE BASE64 FOR FUTURE BUILDS (First build only)
      - name: Capture & Encode Keystore for Future Builds
        if: ${{ secrets.KEYSTORE_BASE64 == '' }}
        run: |
          echo "⚠️ IMPORTANT: Copy the base64 string below and add it as a GitHub Secret named 'KEYSTORE_BASE64'"
          echo "========================================="
          base64 release.keystore
          echo "========================================="
          echo "Then future builds will automatically reuse this keystore."

      - name: Archive Keystore for Safe Keeping
        uses: actions/upload-artifact@v4
        with:
          name: neon-reflex-permanent-key
          path: release.keystore
